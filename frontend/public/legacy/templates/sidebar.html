    <aside class="sidebar" id="sidebar" style="width: var(--sidebar-w); background: var(--sidebar-shell-bg, #f7f4ee); border-right: 1.5px solid var(--sidebar-shell-border, var(--p-accent-gold)); height: 100vh; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 300; transition: transform .3s cubic-bezier(.4,0,.2,1); box-shadow: 4px 0 24px rgba(0,0,0,0.03); padding-bottom: 26px;">
      <div class="sb-head" style="padding: 16px; background: #17324D; border-bottom: 2px solid var(--p-accent-gold);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 800; color: #ffffff; letter-spacing: 1px; text-transform: uppercase;">Project Menu</span>
          <i data-lucide="menu" style="width: 14px; height: 14px; color: var(--p-accent-gold);"></i>
        </div>
      </div>
      <nav class="sb-nav" style="padding: 16px; flex: 1; overflow-y: auto; background: var(--sidebar-shell-bg, transparent);">
        <div class="sb-section portal-main-nav" id="portal-main-nav" style="margin-bottom: 16px;">
          <div class="sb-section-lbl" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 800; color: var(--p-accent); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; padding: 0 4px;">Portal</div>
          <button class="sb-item" onclick="clearActiveProject(); showView('dashboard',this)"><span class="sb-ico"><i data-lucide="home"></i></span><span>Home</span></button>
          <button class="sb-item" onclick="openAboutDsr(this)"><span class="sb-ico"><i data-lucide="info"></i></span><span>About DSR</span></button>
          <button class="sb-item" onclick="showView('projects',this)"><span class="sb-ico"><i data-lucide="folder"></i></span><span>Projects</span></button>
          <button class="sb-item" onclick="showView('workflow',this)"><span class="sb-ico"><i data-lucide="activity"></i></span><span>Workflow</span></button>
          <button class="sb-item" id="sb-main-audit-logs" onclick="showView('audit-logs',this)"><span class="sb-ico"><i data-lucide="clipboard-list"></i></span><span>Audit Logs</span></button>
          <button class="sb-item" id="sb-main-settings" onclick="showView('settings',this)"><span class="sb-ico"><i data-lucide="settings"></i></span><span>Settings</span></button>
          <button class="sb-item" onclick="openDistrictMap(this)"><span class="sb-ico"><i data-lucide="map-pin"></i></span><span>Districts</span></button>
          <button class="sb-item" onclick="clearActiveProject(); showView('dashboard', this); setTimeout(()=>document.getElementById('dash-contact-section')?.scrollIntoView({behavior:'smooth', block:'start'}), 80);"><span class="sb-ico"><i data-lucide="phone"></i></span><span>Contact</span></button>
          <button class="sb-item" type="button" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') !== 'true')"><span class="sb-ico"><i data-lucide="ellipsis"></i></span><span>More</span></button>
        </div>
        <div class="sb-section" id="sidebar-new-project-section" style="margin-bottom: 16px;">
          <button class="sb-item" style="background: var(--p-accent-gold) !important; color: #17324D !important; font-weight: 700; border: 1.5px solid var(--p-accent-gold) !important; border-radius: 6px; display: flex; align-items: center; justify-content: center; width: 100%; height: 36px; gap: 6px; cursor: pointer;" onclick="newProjectModal()">
            <span class="sb-ico" style="display: flex; align-items: center; justify-content: center; width: auto; height: auto;"><i data-lucide="plus" style="width: 14px; height: 14px; color: #17324D !important;"></i></span>
            <span>New Project</span>
          </button>
        </div>
        <div class="sb-section" id="overview-nav" style="display:none;"></div>
        <div class="sb-section" id="report-nav" style="display:none;"></div>
        <div class="sb-section" id="annexure-nav" style="display:none;"></div>
        <div class="sb-section" id="replenishment-nav" style="display:none;"></div>
        <div class="sb-section" id="finalize-nav" style="display:none;"></div>
      </nav>
      <div class="sb-bottom-container" style="border-top: 1px solid var(--border); padding: 16px; background: var(--sidebar-shell-bg, #f7f4ee);">

        <div style="display: flex; justify-content: flex-start; padding-left: 4px;">
          <button class="sb-logout-btn" onclick="doLogout()" style="background: none; border: none; cursor: pointer; color: var(--text-soft); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s;">
            <i data-lucide="log-out" style="width: 13px; height: 13px; color: var(--text-faint);"></i>Logout
          </button>
        </div>
      </div>
    </aside>
