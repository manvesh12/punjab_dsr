<div class="topbar dash-global-topbar gov-compact-topbar gov-enterprise-topbar">
  <div class="gov-enterprise-brand-row">
    <div class="gov-enterprise-brand-left">
      <button id="tb-sidebar-toggle" type="button" class="dash-action-icon-btn gov-menu-toggle" onclick="return toggleSidebar(event)" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="false">
        <i data-lucide="menu"></i>
      </button>
      <button class="gov-brand-button gov-enterprise-brand" type="button" onclick="clearActiveProject(); showView('dashboard', null);" aria-label="Go to dashboard">
        <img src="assets/dsr-logo.png" alt="Punjab Government Smart DSR Logo" class="gov-logo gov-logo-punjab">
        <span class="gov-iit-logo" aria-label="IIT Ropar">IIT</span>
        <span class="gov-brand-copy">
          <span class="gov-brand-title">District Survey Report Automation Portal</span>
          <span class="gov-brand-subtitle">Sand Automation for Sand Mining</span>
        </span>
      </button>
    </div>

    <div class="gov-header-right gov-enterprise-actions">
      <button class="dash-gov-badge dash-badge-emgsm gov-emgsm-badge" onclick="showView('workflow', null)">
        <i data-lucide="leaf"></i><span>EMGSM</span>
      </button>

      <div class="dash-menu-search gov-compact-search gov-enterprise-search">
        <i data-lucide="search"></i>
        <input id="tb-portal-search" type="text" placeholder="Search portal..." data-i18n-placeholder="searchPlaceholder" onkeydown="dashRunSearch(event)" aria-label="Search portal">
      </div>

      <button class="dash-action-icon-btn gov-search-icon" onclick="dashFocusSearch()" title="Focus search" aria-label="Focus search">
        <i data-lucide="search"></i>
      </button>

      <div class="tb-nav-dropdown gov-notification-wrap">
        <button type="button" class="dash-action-icon-btn" onclick="toggleNotificationDropdown()" title="Notifications" aria-label="Notifications">
          <i data-lucide="bell"></i>
          <span id="tb-notif-dot"></span>
        </button>
        <div class="tb-dropdown-menu" id="tb-notif-dropdown">
          <div class="tb-dropdown-title">Notifications</div>
          <div id="tb-notif-list" class="tb-empty-note">No new notifications</div>
        </div>
      </div>

      <button class="dash-action-icon-btn dash-theme-toggle tb-theme-toggle" onclick="toggleDarkMode()" title="Toggle dark mode" aria-label="Toggle dark mode" data-theme-toggle>
        <i data-lucide="moon"></i>
      </button>

      <div class="tb-nav-dropdown gov-actions-more">
        <button type="button" class="dash-action-icon-btn" title="More tools" aria-label="More tools">
          <i data-lucide="ellipsis"></i>
        </button>
        <div class="tb-dropdown-menu">
          <button type="button" onclick="dashPortalToast('Screen reader mode is ready. Use browser accessibility tools to continue.')">
            <i data-lucide="eye"></i><span>Screen reader</span>
          </button>
          <button type="button" onclick="changeFontSize(-1)">A- Font</button>
          <button type="button" onclick="changeFontSize(0)">A Font</button>
          <button type="button" onclick="changeFontSize(1)">A+ Font</button>
          <button type="button" data-lang="en" onclick="applyPortalLanguage('en')">English</button>
          <button type="button" data-lang="hi" onclick="applyPortalLanguage('hi')">Hindi</button>
          <button type="button" data-lang="pa" onclick="applyPortalLanguage('pa')">Punjabi</button>
          <button type="button" onclick="clearActiveProject(); showView('dashboard', null); setTimeout(()=>document.getElementById('dash-contact-section')?.scrollIntoView({behavior:'smooth', block:'start'}), 80);">
            <i data-lucide="help-circle"></i><span>Help</span>
          </button>
          <button type="button" onclick="dashSharePortal()">
            <i data-lucide="share-2"></i><span>Copy portal link</span>
          </button>
          <button type="button" onclick="showView('workflow', null)">
            <i data-lucide="git-branch"></i><span>Workflow shortcuts</span>
          </button>
        </div>
      </div>

      <button class="gov-profile-chip" type="button" onclick="showView('settings', null)" title="User profile" aria-label="User profile">
        <i data-lucide="user-circle"></i><span>Profile</span>
      </button>
      <button onclick="doLogout()" class="dash-btn-logout gov-logout-btn">
        <i data-lucide="log-out"></i><span>Logout</span>
      </button>
    </div>
  </div>

  <div class="gov-enterprise-nav-row">
    <nav class="gov-primary-nav gov-enterprise-nav" aria-label="Primary navigation">
      <button class="tb-sub-nav-btn" onclick="clearActiveProject(); showView('dashboard', this)">
        <i data-lucide="home"></i><span data-i18n="navHome">Home</span>
      </button>
      <button class="tb-sub-nav-btn" onclick="openAboutDsr(this)">
        <i data-lucide="info"></i><span data-i18n="navAbout">About DSR</span>
      </button>
      <div class="tb-nav-dropdown gov-nav-dropdown">
        <button class="tb-sub-nav-btn" onclick="showView('projects', this)">
          <i data-lucide="folder"></i><span data-i18n="navProjects">Projects</span>
        </button>
        <div class="tb-dropdown-menu" id="tb-projects-dropdown">
          <a href="#" onclick="showView('projects', null); return false;">View All Projects</a>
          <a href="#" onclick="newProjectModal(); return false;">Add New Project</a>
        </div>
      </div>
      <button class="tb-sub-nav-btn" onclick="showView('workflow', this)">
        <i data-lucide="activity"></i><span data-i18n="navWorkflow">Workflow</span>
      </button>
      <button class="tb-sub-nav-btn" id="tb-nav-audit-logs" style="display:none" onclick="showView('audit-logs', this)">
        <i data-lucide="clipboard-list"></i><span data-i18n="navAudit">Audit Logs</span>
      </button>
      <button class="tb-sub-nav-btn" id="tb-nav-users" style="display:none" onclick="showView('settings', this)">
        <i data-lucide="settings"></i><span>Settings</span>
      </button>
      <button class="tb-sub-nav-btn gov-nav-optional" onclick="openDistrictMap(this)">
        <i data-lucide="map-pin"></i><span data-i18n="navDistricts">Districts</span>
      </button>
      <button class="tb-sub-nav-btn gov-nav-optional" onclick="clearActiveProject(); showView('dashboard', this); setTimeout(()=>document.getElementById('dash-contact-section')?.scrollIntoView({behavior:'smooth', block:'start'}), 80);">
        <i data-lucide="phone"></i><span data-i18n="navContact">Contact</span>
      </button>
      <div class="tb-nav-dropdown gov-nav-more">
        <button class="tb-sub-nav-btn" type="button">
          <i data-lucide="chevron-down"></i><span>More</span>
        </button>
        <div class="tb-dropdown-menu">
          <button type="button" onclick="openDistrictMap(this)">
            <i data-lucide="map-pin"></i><span data-i18n="navDistricts">Districts</span>
          </button>
          <button type="button" onclick="clearActiveProject(); showView('dashboard', this); setTimeout(()=>document.getElementById('dash-contact-section')?.scrollIntoView({behavior:'smooth', block:'start'}), 80);">
            <i data-lucide="phone"></i><span data-i18n="navContact">Contact</span>
          </button>
        </div>
      </div>
    </nav>
  </div>

  <div class="dash-gov-notice-ticker gov-compact-notice gov-enterprise-notice">
    <div class="dash-notice-label">
      <i data-lucide="megaphone"></i><span data-i18n="noticeLabel">Notice</span>
    </div>
    <div class="dash-notice-marquee-container">
      <div class="dash-notice-marquee-text">
        <span data-i18n="noticeText">DSR preparation live for all districts - EMGSM 2020 compliance</span>
      </div>
    </div>
    <span class="tb-district" id="tb-district-badge">Punjab</span>
  </div>
</div>
