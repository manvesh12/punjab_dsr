<div id="view-replenishment" class="view h-[calc(100vh-64px)] w-full overflow-hidden bg-[#F7F4EE] flex flex-col font-sans">
  <!-- Top Toolbar -->
  <div class="h-16 bg-[#17324D] border-b border-[#0f2438] shadow-md flex items-center justify-between px-6 flex-shrink-0 z-30">
    <div class="flex items-center gap-4 text-white">
      <h1 class="text-xl font-bold tracking-tight flex items-center gap-3">
        <svg class="w-7 h-7 text-[#C49A58]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        Replenishment Report Editor
      </h1>
      <span class="w-px h-6 bg-[#2a4a6b] mx-2"></span>
      <span id="repl-project-title" class="text-sm font-medium text-blue-100 bg-[#0f2438] px-3 py-1 rounded border border-[#2a4a6b]">Loading Project...</span>
    </div>
    
    <div class="flex items-center gap-4">
      <button id="repl-auto-fetch-btn" class="flex items-center gap-2 px-3 py-1.5 text-[#C49A58] hover:bg-[#2a4a6b] rounded-lg font-medium text-sm transition-colors border border-transparent hover:border-[#C49A58]/50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Sync DSR Data
      </button>

      <div class="w-px h-6 bg-[#2a4a6b]"></div>
      
      <!-- Validation Status -->
      <button id="repl-validation-btn" class="flex items-center gap-2 px-4 py-2 bg-[#FDE68A]/10 text-[#FDE68A] rounded hover:bg-[#FDE68A]/20 transition-colors border border-[#FDE68A]/30 font-medium text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <span>Pending Review</span>
      </button>

      <!-- Submit Workflow -->
      <button id="repl-submit-btn" class="flex items-center gap-2 px-5 py-2 bg-[#C49A58] text-[#17324D] rounded font-bold text-sm shadow-md hover:bg-[#d8ae6c] transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        Approve & Submit
      </button>
      
      <!-- Download -->
      <button id="repl-download-btn" class="flex items-center gap-2 px-3 py-2 bg-white/10 text-white rounded hover:bg-white/20 transition-colors border border-white/20 font-medium text-sm ml-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      </button>
    </div>
  </div>

  <!-- Main Workspace - 3 Panels -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- LEFT PANEL: Navigation (18%) -->
    <div class="w-[18%] bg-white border-r border-gray-200 flex flex-col relative z-20 shadow-[2px_0_10px_-3px_rgba(0,0,0,0.05)]">
      <div class="p-4 border-b border-gray-100">
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Document Map</h2>
        <div class="text-[10px] text-gray-400">Jump to section</div>
      </div>
      <div id="repl-sidebar-container" class="flex-1 overflow-y-auto custom-scrollbar p-2">
        <!-- Sidebar Navigation Injected Here -->
      </div>
    </div>

    <!-- CENTER PANEL: Editor Workspace (42%) -->
    <div class="w-[42%] bg-[#F7F4EE] border-r border-gray-300 flex flex-col relative z-10 shadow-[inset_0_0_20px_rgba(0,0,0,0.02)]">
      <!-- Search Sticky Header -->
      <div class="p-3 border-b border-gray-200 bg-white/80 backdrop-blur-md sticky top-0 z-20">
        <div class="relative w-full">
          <input type="text" id="repl-search-input" placeholder="Search sections, fields, or comments..." class="w-full pl-9 pr-4 py-1.5 border-none bg-gray-100 rounded focus:ring-2 focus:ring-[#C49A58] focus:bg-white transition-colors text-sm shadow-inner">
          <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
      </div>

      <!-- Accordion Forms -->
      <div id="repl-accordion-container" class="flex-1 overflow-y-auto p-6 space-y-5 pb-24 custom-scrollbar">
        <!-- Accordion Cards Injected Here -->
      </div>
    </div>

    <!-- RIGHT PANEL: Live PDF Preview (40%) -->
    <div class="w-[40%] bg-gray-100 flex flex-col relative shadow-[inset_4px_0_15px_-5px_rgba(0,0,0,0.1)]">
      <div class="p-2 border-b border-gray-200 bg-white flex justify-between items-center text-xs font-medium text-gray-500 shadow-sm z-10 px-4">
        <span class="flex items-center gap-2 font-bold text-[#17324D] uppercase tracking-wider">
          <svg class="w-4 h-4 text-[#C49A58]" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"></path><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"></path></svg>
          Live Document Preview
        </span>
        <div class="flex gap-2 items-center bg-gray-100 rounded border border-gray-200 p-0.5">
          <button class="p-1 hover:bg-white rounded text-gray-500 transition-colors shadow-sm" title="Zoom Out"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg></button>
          <span class="px-2 text-gray-600">Fit Page</span>
          <button class="p-1 hover:bg-white rounded text-gray-500 transition-colors shadow-sm" title="Zoom In"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg></button>
        </div>
      </div>
      
      <div class="flex-1 overflow-y-auto p-6 flex justify-center bg-[#E5E7EB] custom-scrollbar">
        <!-- A4 Page Container (Auto-scaled down a bit to fit 40% width on 1080p) -->
        <div id="repl-pdf-preview" class="w-[794px] min-h-[1123px] bg-white shadow-xl border border-gray-300 p-12 text-gray-800 text-sm leading-relaxed transition-all duration-300 transform scale-[0.60] 2xl:scale-75 origin-top relative mb-32">
           <!-- Content injected by JS -->
           <div class="animate-pulse space-y-4">
             <div class="h-8 bg-gray-200 rounded w-3/4 mx-auto mb-10"></div>
             <div class="h-4 bg-gray-200 rounded w-full"></div>
             <div class="h-4 bg-gray-200 rounded w-5/6"></div>
             <div class="h-4 bg-gray-200 rounded w-4/6"></div>
             <div class="h-32 bg-gray-200 rounded w-full my-8"></div>
             <div class="h-4 bg-gray-200 rounded w-full"></div>
             <div class="h-4 bg-gray-200 rounded w-5/6"></div>
           </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Status Bar -->
  <div class="h-8 bg-white border-t border-gray-200 shadow-[0_-2px_5px_rgba(0,0,0,0.02)] flex items-center justify-between px-4 text-xs text-gray-500 flex-shrink-0 z-40">
    <div class="flex items-center gap-4">
      <span class="flex items-center gap-1 font-medium text-gray-700">
        <svg class="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        Active Officer: Admin
      </span>
      <span class="w-px h-3 bg-gray-300"></span>
      <span class="flex items-center gap-1">
        Completion: <span class="font-bold text-[#17324D]">14%</span>
      </span>
      <span class="w-px h-3 bg-gray-300"></span>
      <span class="text-orange-500 font-medium">3 Pending Uploads</span>
    </div>
    <div class="flex items-center gap-3">
      <!-- Auto Save Indicator -->
      <div id="repl-autosave-status" class="flex items-center gap-1.5 text-green-600 font-medium">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        Saved Just Now
      </div>
      <span class="w-px h-3 bg-gray-300"></span>
      <span>v1.0.4 (Draft)</span>
    </div>
  </div>
</div>
