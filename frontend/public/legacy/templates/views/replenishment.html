<style>
  /* Enterprise 3-Panel Workspace Styles (No Tailwind) */
  #view-replenishment {
    height: calc(100vh - var(--topbar-h, 64px));
    width: 100%;
    overflow: hidden;
    background: #F7F4EE;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
  }
  
  .repl-toolbar {
    height: 64px;
    background: #17324D;
    border-bottom: 1px solid #0f2438;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
    z-index: 30;
    color: #fff;
  }
  .repl-toolbar-left, .repl-toolbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .repl-toolbar-title {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .repl-toolbar-badge {
    font-size: 14px;
    font-weight: 500;
    color: #dbeafe;
    background: #0f2438;
    padding: 4px 12px;
    border-radius: 4px;
    border: 1px solid #2a4a6b;
  }
  .repl-divider-y {
    width: 1px;
    height: 24px;
    background: #2a4a6b;
  }

  .repl-workspace {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* PANEL 1: Navigation */
  .repl-panel-left {
    width: 18%;
    min-width: 240px;
    background: #ffffff;
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 20;
    box-shadow: 2px 0 10px -3px rgba(0,0,0,0.05);
  }
  .repl-panel-left-header {
    padding: 16px;
    border-bottom: 1px solid #f3f4f6;
  }
  .repl-panel-left-header h2 {
    font-size: 12px;
    font-weight: 700;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 0 0 4px 0;
  }
  .repl-sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  /* PANEL 2: Editor */
  .repl-panel-center {
    width: 42%;
    background: #F7F4EE;
    border-right: 1px solid #d1d5db;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 10;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
  }
  .repl-search-header {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .repl-search-input-wrapper {
    position: relative;
    width: 100%;
  }
  .repl-search-input-wrapper input {
    width: 100%;
    padding: 6px 16px 6px 36px;
    border: none;
    background: #f3f4f6;
    border-radius: 4px;
    font-size: 14px;
    transition: all 0.2s;
  }
  .repl-search-input-wrapper input:focus {
    background: #ffffff;
    box-shadow: 0 0 0 2px #C49A58;
    outline: none;
  }
  .repl-accordion-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    padding-bottom: 100px;
  }

  /* PANEL 3: Preview */
  .repl-panel-right {
    width: 40%;
    background: #f3f4f6;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: inset 4px 0 15px -5px rgba(0,0,0,0.1);
  }
  .repl-preview-header {
    padding: 8px 16px;
    border-bottom: 1px solid #e5e7eb;
    background: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .repl-preview-title {
    font-size: 12px;
    font-weight: 700;
    color: #17324D;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .repl-preview-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    justify-content: center;
    background: #e5e7eb;
  }
  .repl-pdf-canvas {
    width: 794px;
    min-height: 1123px;
    background: #ffffff;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    border: 1px solid #d1d5db;
    padding: 48px;
    color: #1f2937;
    font-size: 14px;
    line-height: 1.6;
    transform: scale(0.60);
    transform-origin: top center;
    margin-bottom: 120px;
    transition: transform 0.3s ease;
  }
  @media (min-width: 1536px) {
    .repl-pdf-canvas { transform: scale(0.75); }
  }

  /* Bottom Status Bar */
  .repl-status-bar {
    height: 32px;
    background: #ffffff;
    border-top: 1px solid #e5e7eb;
    box-shadow: 0 -2px 5px rgba(0,0,0,0.02);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    font-size: 12px;
    color: #6b7280;
    flex-shrink: 0;
    z-index: 40;
  }
  .repl-status-group {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .repl-status-divider {
    width: 1px;
    height: 12px;
    background: #d1d5db;
  }

  /* Utility standard buttons for Replenishment */
  .repl-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
  }
  .repl-btn-ghost {
    background: transparent;
    color: #C49A58;
    border: 1px solid transparent;
  }
  .repl-btn-ghost:hover {
    background: #2a4a6b;
    border-color: rgba(196, 154, 88, 0.5);
  }
  .repl-btn-warning {
    background: rgba(253, 230, 138, 0.1);
    color: #FDE68A;
    border: 1px solid rgba(253, 230, 138, 0.3);
  }
  .repl-btn-warning:hover {
    background: rgba(253, 230, 138, 0.2);
  }
  .repl-btn-primary {
    background: #C49A58;
    color: #17324D;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  }
  .repl-btn-primary:hover {
    background: #d8ae6c;
  }
  .repl-btn-icon {
    padding: 6px 12px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .repl-btn-icon:hover {
    background: rgba(255,255,255,0.2);
  }
  
  /* Reset SVG sizing inside our custom toolbars to prevent blowups */
  .repl-toolbar svg, .repl-status-bar svg, .repl-preview-header svg {
    width: 18px !important;
    height: 18px !important;
    flex-shrink: 0;
  }
  .repl-toolbar-title svg {
    width: 24px !important;
    height: 24px !important;
    color: #C49A58 !important;
  }
  .repl-preview-title svg {
    width: 16px !important;
    height: 16px !important;
    color: #C49A58 !important;
  }
</style>
