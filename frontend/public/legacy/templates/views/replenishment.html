<div id="view-replenishment" class="view h-[calc(100vh-64px)] w-full overflow-hidden bg-gray-50 flex flex-col">
  <!-- Top Toolbar -->
  <div class="h-14 bg-white border-b border-gray-200 shadow-sm flex items-center justify-between px-6 flex-shrink-0">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        Replenishment Report Builder
      </h1>
      <span id="repl-project-title" class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full border border-gray-200">Loading Project...</span>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- Auto Save Indicator -->
      <div id="repl-autosave-status" class="flex items-center gap-2 text-sm text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full mr-2">
        <svg class="w-4 h-4 text-green-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span>All changes saved</span>
      </div>
      
      <!-- Validation Status -->
      <button id="repl-validation-btn" class="flex items-center gap-2 px-4 py-2 bg-yellow-50 text-yellow-700 rounded-lg hover:bg-yellow-100 transition-colors border border-yellow-200 font-medium text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <span>3 Issues</span>
      </button>

      <!-- Submit Workflow -->
      <button id="repl-submit-btn" class="flex items-center gap-2 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm font-medium text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Submit for Review
      </button>
      
      <!-- Download -->
      <button id="repl-download-btn" class="flex items-center gap-2 px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900 transition-colors shadow-sm font-medium text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        PDF
      </button>
    </div>
  </div>

  <!-- Main Workspace -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- LEFT PANEL: Government Workspace (Forms & Accordions) -->
    <div class="w-1/2 bg-white border-r border-gray-200 flex flex-col relative z-10 shadow-[4px_0_15px_-3px_rgba(0,0,0,0.05)]">
      
      <!-- Search & Filters -->
      <div class="p-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between sticky top-0 z-20">
        <div class="relative w-full max-w-md">
          <input type="text" id="repl-search-input" placeholder="Search sections, fields, or comments..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
          <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <button id="repl-auto-fetch-btn" class="flex items-center gap-2 px-3 py-2 text-blue-600 hover:bg-blue-50 rounded-lg font-medium text-sm border border-transparent hover:border-blue-200 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Sync Latest DSR
        </button>
      </div>

      <!-- Accordion Container -->
      <div id="repl-accordion-container" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20 custom-scrollbar">
        <!-- JS will populate these -->
      </div>
      
    </div>

    <!-- RIGHT PANEL: Live PDF Preview -->
    <div class="w-1/2 bg-gray-100 flex flex-col relative">
      <div class="p-3 border-b border-gray-200 bg-white flex justify-between items-center text-sm font-medium text-gray-600 shadow-sm z-10">
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"></path><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"></path></svg>
          Live A4 Preview
        </span>
        <div class="flex gap-2">
          <button class="px-2 py-1 hover:bg-gray-100 rounded text-gray-500" title="Zoom Out"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg></button>
          <span class="py-1">100%</span>
          <button class="px-2 py-1 hover:bg-gray-100 rounded text-gray-500" title="Zoom In"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg></button>
        </div>
      </div>
      
      <div class="flex-1 overflow-y-auto p-4 flex justify-center bg-gray-200 custom-scrollbar">
        <!-- A4 Page Container -->
        <div id="repl-pdf-preview" class="w-[794px] min-h-[1123px] bg-white shadow-2xl p-12 text-gray-800 text-sm leading-relaxed transition-all duration-300 transform scale-[0.65] xl:scale-75 2xl:scale-90 origin-top">
           <!-- Content injected by JS -->
           <div class="animate-pulse space-y-4">
             <div class="h-8 bg-gray-200 rounded w-3/4 mx-auto mb-10"></div>
             <div class="h-4 bg-gray-200 rounded w-full"></div>
             <div class="h-4 bg-gray-200 rounded w-5/6"></div>
             <div class="h-4 bg-gray-200 rounded w-4/6"></div>
             <div class="h-32 bg-gray-200 rounded w-full my-8"></div>
             <div class="h-4 bg-gray-200 rounded w-full"></div>
             <div class="h-4 bg-gray-200 rounded w-5/6"></div>
           </div>
        </div>
      </div>
    </div>

  </div>
</div>
