<style>
  #view-replenishment {
    min-height: calc(100vh - var(--topbar-h, 64px));
    width: 100%;
    background: #f3f6fa;
    font-family: Inter, "Segoe UI", sans-serif;
  }

  #view-replenishment.active {
    display: block;
  }

  #repl-editor-container {
    width: 100%;
    min-height: calc(100vh - var(--topbar-h, 64px));
  }
</style>

<div id="view-replenishment" class="view">
  <main id="repl-editor-container" data-repl-bootstrap="true" aria-label="Replenishment report workspace">
    <section style="max-width:980px;margin:32px auto;padding:0 20px;box-sizing:border-box;">
      <header style="text-align:center;margin-bottom:32px;">
        <div style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;background:#fff7ed;color:#c2410c;font-size:24px;font-weight:800;margin-bottom:14px;">R</div>
        <h1 style="margin:0 0 8px;color:#17324d;font-size:24px;">Government Replenishment Report Builder</h1>
        <p style="margin:0;color:#64748b;font-size:14px;">Create a report or open the reports saved under the selected DSR project.</p>
      </header>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;">
        <button type="button" onclick="window.showCreateReportForm && window.showCreateReportForm()" style="min-height:190px;padding:28px;text-align:left;border:1px solid #dbe4ee;border-radius:14px;background:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(15,23,42,.06);">
          <span style="display:inline-flex;padding:6px 10px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800;text-transform:uppercase;">New report</span>
          <h2 style="margin:18px 0 8px;color:#17324d;font-size:19px;">Create Official Report</h2>
          <p style="margin:0;color:#64748b;line-height:1.55;font-size:13px;">Scan the Final DSR and prepare the required upload cards and report sections.</p>
        </button>
        <button type="button" onclick="window.showExistingReportsList && window.showExistingReportsList()" style="min-height:190px;padding:28px;text-align:left;border:1px solid #dbe4ee;border-radius:14px;background:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(15,23,42,.06);">
          <span style="display:inline-flex;padding:6px 10px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:800;text-transform:uppercase;">Saved reports</span>
          <h2 style="margin:18px 0 8px;color:#17324d;font-size:19px;">Open Report Workspace</h2>
          <p style="margin:0;color:#64748b;line-height:1.55;font-size:13px;">Load Imported, Uploaded and Pending cards for the selected project.</p>
        </button>
      </div>
      <p style="margin:20px 0 0;text-align:center;color:#94a3b8;font-size:12px;">Loading project reports…</p>
    </section>
  </main>
</div>
